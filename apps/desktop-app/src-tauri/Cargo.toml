[package]
name = "appsdesktop-app"
version = "1.0.5"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "appsdesktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
regex = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
comrak = { version = "0.59", default-features = false }

# 预留：自动更新插件。当前走「手动检查 + 跳转 Gitee 下载」的轻量方案，
# 不启用 tauri-plugin-updater，因此应用启动时不会发起任何自动更新请求。
# 需要切换为静默增量更新时，取消下面一行注释并在 lib.rs 注册插件、在
# tauri.conf.json 的 plugins.updater 中填入公钥与更新端点。
# tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Wdk",
  "Wdk_System_SystemServices",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
